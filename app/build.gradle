plugins {
    id 'com.android.application' version '9.2.1'
}

android {
    namespace 'io.github.powergemini'
    compileSdk 37

    defaultConfig {
        applicationId 'io.github.powergemini'
        minSdk 35
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }

    packaging {
        resources {
            merges += 'META-INF/xposed/*'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    compileOnly 'io.github.libxposed:api:102.0.0'
}
